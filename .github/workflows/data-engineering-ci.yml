name: Data Engineering CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  validate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Repository Structure
        run: |
          echo "Repository Structure"
          ls -R

      - name: Validate Architecture Folder
        run: test -d architecture

      - name: Validate Dashboard Folder
        run: test -d dashboardd

      - name: Validate Dataset Info Folder
        run: test -d dataset_info

      - name: Validate Notebooks Folder
        run: test -d notebooks

      - name: Validate Pipeline Folder
        run: test -d pipeline

      - name: Generate Validation Report
        run: |
          echo "==================================" > validation_report.txt
          echo "BRAZIL ECOMMERCE PROJECT" >> validation_report.txt
          echo "==================================" >> validation_report.txt
          echo "Validation Status : SUCCESS" >> validation_report.txt
          echo "Validation Time :" >> validation_report.txt
          date >> validation_report.txt

      - name: Upload Validation Report
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation_report.txt

  build:

    needs: validate

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Build Package
        run: |
          mkdir deploy

          cp -r architecture deploy/
          cp -r dashboardd deploy/
          cp -r dataset_info deploy/
          cp -r notebooks deploy/
          cp -r pipeline deploy/

      - name: Upload Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deploy/

  deploy:

    needs: build

    runs-on: ubuntu-latest

    steps:

      - name: Deployment Stage
        run: |
          echo "=================================="
          echo "Starting Deployment"
          echo "=================================="

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package
          path: deployment

      - name: Verify Deployment Package
        run: |
          ls -R deployment

      - name: Simulate Deployment
        run: |
          echo "Deploying Architecture..."
          echo "Deploying Notebooks..."
          echo "Deploying Dashboards..."
          echo "Deploying Pipelines..."
          echo "Deployment Successful"

  notify:

    needs: deploy

    runs-on: ubuntu-latest

    steps:

      - name: Success Notification
        run: |
          echo "=================================="
          echo "PIPELINE EXECUTED SUCCESSFULLY"
          echo "Validation Completed"
          echo "Build Completed"
          echo "Deployment Completed"
          echo "=================================="

      - name: Generate Final Report
        run: |
          echo "Project : Brazil Ecommerce Analytics" > final_report.txt
          echo "Pipeline Status : SUCCESS" >> final_report.txt
          date >> final_report.txt

      - name: Upload Final Report
        uses: actions/upload-artifact@v4
        with:
          name: final-report
          path: final_report.txt
